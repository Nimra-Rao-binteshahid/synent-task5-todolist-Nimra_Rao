<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 5 - To-Do List App | Nimra Rao</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="todo-app">
    <h2><i class="fa-solid fa-list-check"></i> My To-Do List</h2>
    
    <div class="input-container">
      <input type="text" id="taskInput" placeholder="Add a new task..." autocomplete="off">
      <button id="addBtn"><i class="fa-solid fa-plus"></i> Add</button>
    </div>

    <ul id="taskList">
      <!-- Tasks dynamically load from localStorage -->
    </ul>

    <div class="footer">
      <span id="taskCount">0 tasks left</span>
      <button id="clearAllBtn">Clear All</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
